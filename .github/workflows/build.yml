name: Build

on:
  pull_request:
    branches: [main]

env:
  # App version passed to the Inno Setup installer. Keep in sync with src/SyncTray/Constants.cs (managed by scripts/BumpVersion.ps1).
  AppVersion: 1.0.0

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore SyncTray.sln

      - name: Build
        run: dotnet build SyncTray.sln --no-restore --configuration Release

      - name: Publish SyncTray
        run: >
          dotnet publish src/SyncTray/SyncTray.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncTray-binary
          path: publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ env.AppVersion }}
          /DPublishDir=..\publish
          installer\SyncTray.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncTray-installer
          path: installer/Output/SyncTraySetup.exe
